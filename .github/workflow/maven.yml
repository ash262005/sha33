name:java CI/CD Pipeline
push:
 branches:["master"]
pull_request:
 branches:["master"]
workflow_disptach:
jobs:
 build:
  runs-on:windows-latest
 defaults:
  run:
   working-directory:demo
 -name:check repository
  uses:actions/chekout@v4
 -name:Setup JDK 26
  uses:actions/setup-java@v4
  with:
   java-version:"26"
   distribution:temurin
   cache:maven
-name:build with maven
 run:mvn-batch-mode
--no-transfer-progress clean package
